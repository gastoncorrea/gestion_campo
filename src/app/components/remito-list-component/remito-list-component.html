<div class="width-max">
    <div>
        <a routerLink="/">
            <fa-icon [icon]="faCircleLeft" class="size-icon btn btn-outline-primary border-0" />
        </a>
    </div>
    <div class="d-flex justify-content-between my-4">
        <h1>Remitos</h1>
        <button class="btn btn-outline-primary py-0 m-0">
            Crear Remito
            <fa-icon [icon]="faPlus" />
        </button>
    </div>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>N° Remito</th>
                <th>Emisor</th>
                <th>Receptor</th>
                <th>Fecha de emisión</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            @for (remito of remitos(); track $index) {
            <tr class="fila-principal" (click)="seleccionarRemito($event, remito)">
                <td>{{remito.Re_id}}</td>
                <td>{{remito['Nro Remito']}}</td>
                <td>{{remito.Emisor}}</td>
                <td>{{remito.Receptor}}</td>
                <td>{{remito['Fecha de emision']}}</td>
                <td>
                    <span class="badge" [ngClass]="remito.claseEstado">
                        {{remito.estado}}
                    </span>
                </td>
            </tr>
            @if (remitoSeleccionado() === (remito['Nro Remito'])) {
            <tr>
                <td colspan="6" class="p-0">
                    <app-remito-detalle 
                        [detalles]="detalle_remito()"
                        [compras]="todasLasCompras()"
                        [detallesCompras]="todosLosDetallesCompras()"
                        [idRemito]="remito['Nro Remito']"
                        [nroRemito]="remito['Nro Remito']"
                        [proveedor]="remito.Emisor"
                        [estado]="remito.estado"
                        (compraGuardada)="cargarDatos()">
                    </app-remito-detalle>
                </td>
            </tr>
            }
            }
        </tbody>
    </table>
</div>
