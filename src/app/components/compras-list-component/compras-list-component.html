<div class="width-max">
    <div>
        <a routerLink="/">
            <fa-icon [icon]="faCircleLeft" class="size-icon btn btn-outline-primary border-0" />
        </a>
    </div>
    <div class="d-flex justify-content-between my-4">
        <h1>Compras</h1>
        <button class="btn btn-outline-primary py-0 m-0">
            Crear Compra
            <fa-icon [icon]="faPlus" />
        </button>
    </div>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID Compra</th>
                <th>ID Remito</th>
                <th>Fecha</th>
                <th>Proveedor</th>
                <th>Moneda</th>
            </tr>
        </thead>
        <tbody>
            @for (compra of compras(); track $index) {
            <tr>
                <td>{{compra['id_compra']}}</td>
                <td>{{compra['Nro Remito']}}</td>
                <td>{{compra['fecha']}}</td>
                <td>{{compra['proveedor']}}</td>
                <td>{{compra['moneda']}}</td>
            </tr>
            }
        </tbody>
    </table>
</div>
