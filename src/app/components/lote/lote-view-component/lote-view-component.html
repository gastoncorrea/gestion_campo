<div>
        <a routerLink="/">
            <fa-icon [icon]="faCircleLeft" class="size-icon btn btn-outline-primary border-0" />
        </a>
    </div>
@for (lote of lotes(); track lote.id_lote) {
<div class="text-center">
    <div>
        <h4>Lote: {{lote.nombre_lote}} </h4>
        <h4>Superficie:{{lote.superficie_ha}} </h4>
    </div>
    <div>
        <app-lote-map [lote]="lote"></app-lote-map>
    </div>
    <button (click)="guardarLote()">Guardar Lote</button>
</div>
}
